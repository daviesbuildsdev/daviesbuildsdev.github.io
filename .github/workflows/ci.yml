# The check gate.
#
# Runs on every push to main and on every pull request. It runs exactly the
# same four commands you run locally, so a green tick here means the same
# thing as a clean run on your laptop.
#
# The `check` job runs on every push and every pull request.
#
# The `deploy` job runs only on main, only after the checks pass, and publishes
# the built site to GitHub Pages. A pull request therefore gets checked but
# never published — which is the whole point of working on a branch.
#
# ⚠️ This requires Pages to be switched on first:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# With Pages off, deploy fails for a reason that has nothing to do with the
# code. Turn it on before merging this.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# What the workflow is allowed to do. Pages deployment needs to write to Pages
# and to mint an identity token; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. If two pushes land close together the newer one
# waits rather than racing — `cancel-in-progress: false` means a half-finished
# deploy is never abandoned mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # `pnpm build` writes the finished site into `out/`. This packs that
      # directory up so the deploy job below can publish it. It runs on every
      # check, including pull requests — packing is harmless, publishing is not.
      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    # Only from main. A pull request gets checked, never published.
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
